<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  
</head>
<style>
    /* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* NAVBAR */
#navbar {
  position: fixed;   /* Important for test */
  top: 0;
  width: 100%;
  background: #333;
}

#navbar ul {
  display: flex;
  justify-content: center;
  list-style: none;
}

#navbar a {
  color: white;
  padding: 15px 20px;
  text-decoration: none;
}

#navbar a:hover {
  background: #555;
}

/* WELCOME SECTION */
#welcome-section {
  height: 100vh; /* Important test */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #0a192f;
  color: white;
  text-align: center;
}

/* PROJECT SECTION */
#project-section {
  padding: 80px 20px;
  text-align: center;
}

.project-tile {
  margin: 20px;
  padding: 20px;
  border: 1px solid #ccc;
}

.project-tile a {
  text-decoration: none;
  color: black;
}

/* CONTACT */
#contact {
  padding: 50px;
  text-align: center;
}

/* MEDIA QUERY (required test) */
@media (max-width: 600px) {
  #navbar ul {
    flex-direction: column;
  }
}
</style>
<body>

  <!-- NAVBAR -->
  <nav id="navbar">
    <ul>
      <li><a href="#welcome-section">Home</a></li>
      <li><a href="#project-section">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- WELCOME SECTION -->
  <section id="welcome-section">
    <h1>Hi, I'm Chirag 👋</h1>
    <p>A Web Developer</p>
  </section>

  <!-- PROJECTS SECTION -->
  <section id="project-section">
    <h2>My Projects</h2>

    <div class="project-tile">
      <a href="https://example.com" target="_blank">
        <h3>Project One</h3>
        <p>Simple description of project</p>
      </a>
    </div>

  </section>

  <!-- CONTACT -->
  <section id="contact">
    <h2>Contact Me</h2>
    <a id="profile-link" href="https://github.com/" target="_blank">
      My GitHub
    </a>
  </section>

</body>
</html>
